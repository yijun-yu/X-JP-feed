name: generate-feed

on:
  schedule:
    # 北京时间 08:00 / 12:00 / 16:00 / 21:00
    - cron: '0 0,4,8,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-feed
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate posts
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/generate.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add packs
          git diff --cached --quiet || (git commit -m "feed: $(date -u +%Y-%m-%dT%H)" && git push)
